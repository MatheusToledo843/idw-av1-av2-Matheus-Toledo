    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="text-center mb-4">Entre em Contato</h1>
          <p class="text-center text-muted mb-4">
            Tem alguma dúvida, sugestão de pauta ou quer falar sobre o universo Ferrari? Envie sua mensagem!
          </p>

          <form class="p-4 border rounded shadow-sm bg-light">
            
            <div class="mb-3">
              <label for="nome" class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
            </div>

            <div class="mb-3">
              <label for="assunto" class="form-label">Assunto</label>
              <select class="form-select" id="assunto" required>
                <option value="" selected disabled>Selecione um assunto</option>
                <option value="sugestao">Sugestão de Matéria</option>
                <option value="f1">Dúvida sobre Fórmula 1</option>
                <option value="parceria">Parcerias e Anúncios</option>
                <option value="outro">Outros Assuntos</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-danger btn-lg">Enviar Mensagem</button>
            </div>

          </form>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
